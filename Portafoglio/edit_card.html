<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/newav.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotted. — Registro avvistamenti</title>

<header class="site-header">
  <div class="header-inner">
    <nav class="main-nav">
      <h2 class="logo">Spotted</h2>
      <a href="index.html" >Home</a>
      <a href="nuovo_av.html">Nuovo avvistamento</a>
      <a href="about.html" class="active">About me</a>
    </nav>
    <div class="user-area"  id="userArea"></div>

  </div>
  <section class="hero">
    <p class="hero-sub">Il registro degli avvistamenti, cataloga ogni auto rara che incroci.</p>
  </section>
</header>
</head>
</head>

<body>
  <!-- Form che va  utilizzato per modificare i dati di un avvistamento, la configurazione e identica a quella per la creazione di esso-->
  <main class="form-card">
    <h1>Modifica un avvistamento</h1>
    <p class="page-sub">Carica una foto e i dettagli dell'auto che hai incrociato.</p>
    <div class="form-msg" id="newSpotMsg"></div>

    <form id="newSpotForm" novalidate>

      <label class="foto"  for="immagine">
        <span>Foto</span>
      </label>
      <div class="dropzone" id="dropzone">
        <p>Seleziona una foto</p>
        <input type="file" id="immagine" name="immagine" accept="image/*" title="Seleziona una foto">
      </div>
      <div class="image-preview" id="imagePreview">
        <img src="" alt="Anteprima foto auto">
        <button type="button" class="remove-image" aria-label="Rimuovi immagine">✕</button>
      </div>

      <div class="form-grid">
        <div class="marca">
          <label for="marca">Marca</label>
          <input type="text" id="marca" name="marca" required placeholder="Es. Ferrari">
        </div>
        <div class="modello">
          <label for="modello">Modello</label>
          <input type="text" id="modello" name="modello" required placeholder="Es. 296 GTB">
        </div>
        <div class="anno">
          <label for="anno">Anno</label>
          <input type="number" id="anno" name="anno" min="1900" max="2100" placeholder="Es. 2023">
        </div>
        <div class="categoria">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria">
            <option value="">Seleziona…</option>
          </select>
        </div>
        <div class="luogo">
          <label for="luogo">Luogo</label>
          <input type="text" id="luogo" name="luogo" placeholder="Es. Milano">
        </div>
        <div class="targa">
          <label for="targa">Targa</label>
          <input type="text" id="targa" name="targa" placeholder="Es. AB123CD ">
        </div>
        <div class="dataAV">
          <label for="data_avvistamento">Data avvistamento</label>
          <input type="date" id="data_avvistamento" name="data_avvistamento" required>
        </div>
        <div class="descrizione">
          <label for="descrizione">Descrizione</label>
          <textarea id="descrizione" name="descrizione" placeholder="Dove l'hai vista, dettagli particolari, colore, sound del motore..."></textarea>
        </div>
      </div>

    <div class="form-actions">
      <a href="index.html" class="btn btn-ghost">Annulla</a>
      <button type="submit" class="btn btn-accent">Salva avvistamento</button>
    </div>
  </form>
</main>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/form.js"></script>
</body>
</html>
