<!DOCTYPE html>
<html lang="it">
<link rel="stylesheet" href="css/login.css">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi — Spotted.</title>


<header class="site-header">
  <div class="header-inner">
    <nav class="main-nav">
      <h2 class="logo">Spotted</h2>
      <a href="index.html" >Home</a>
      <a href="nuovo_av.html">Nuovo avvistamento</a>
      <a href="about.html" class="active">About me</a>
    </nav>
    <div class="user-area"  id="userArea"></div>

  </div>
  <section class="hero">
    <p class="hero-sub">Il registro degli avvistamenti, cataloga ogni auto rara che incroci.</p>
  </section>
</header>
</head>

</head>

<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Accedi</h1>
    <p class="auth-sub">Bentornato nel tuo garage digitale.</p>

    <div class="form-msg" id="loginMsg"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-accent">Accedi</button>
    </form>

    <p class="auth-switch">Non hai un account? <a href="register.html">Registrati</a></p>
  </div>
</div>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>


</body>
</html>
