<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="css/login.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — Spotted.</title>
</head>

<!-- Intestazione con navigazione, slogan e stato della sessione. -->
<header class="site-header">
  <div class="header-inner">
    <nav class="main-nav">
      <h2 class="logo">Spotted</h2>
      <a href="index.html" >Home</a>
      <a href="nuovo_av.html">Nuovo avvistamento</a>
      <a href="about.html" class="active">About me</a>
    </nav>
    <div class="user-area"  id="userArea"></div>

  </div>
  <section class="hero">
    <p class="hero-sub">Il registro degli avvistamenti, cataloga ogni auto rara che incroci.</p>
  </section>
</header>


<body>
<!-- Contenitore del modulo di accesso. -->
<div class="auth-shell">
  <div class="auth-card">
    <h1>Accedi</h1>
    <p class="auth-sub">Bentornato nel tuo garage digitale.</p>

    <!-- Area usata per mostrare eventuali errori di accesso. -->
    <div class="form-msg" id="loginMsg"></div>

    <!-- Il submit viene intercettato da initLoginForm() in auth.js. -->
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-accent">Accedi</button>
    </form>

    <!-- Invita i nuovi utenti a creare un account. -->
    <p class="auth-switch">Non hai un account? <a href="register.html">Registrati</a></p>
  </div>
</div>


<!-- API e gestione autenticazione. -->
<script src="js/api.js"></script>
<script src="js/auth.js"></script>


</body>
</html>
