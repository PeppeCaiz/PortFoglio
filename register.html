<!DOCTYPE html>
<html lang="it">
<link rel="stylesheet" href="css/login.css">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrati — Spotted.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<header class="site-header">
  <div class="header-inner">
    <nav class="main-nav">
      <h2 class="logo">Spotted</h2>
      <a href="index.html" >Home</a>
      <a href="nuovo_av.html">Nuovo avvistamento</a>
      <a href="about.html" class="active">About me</a>
    </nav>
    <div class="user-area"  id="userArea"></div>

  </div>
  <section class="hero">
    <p class="hero-sub">Il registro degli avvistamenti, cataloga ogni auto rara che incroci.</p>
  </section>
</header>
</head>


</head>

<body>
<div class="auth-shell">
  <div class="auth-card">
    <h1>Crea un account</h1>
    <p class="auth-sub">Inizia a catalogare le tue scoperte su quattro ruote.</p>

    <div class="form-msg" id="registerMsg"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="username">Nome utente</label>
        <input type="text" id="username" name="username" required autocomplete="username" minlength="3">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field">
        <label for="passwordConfirm">Conferma password</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn btn-accent">Registrati</button>
    </form>

    <p class="auth-switch">Hai già un account? <a href="login.html">Accedi</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>

</body>
</html>
